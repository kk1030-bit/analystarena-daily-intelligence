services:
  - type: web
    name: analystarena-daily
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: AUDIT_HMAC_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: REDDIT_SEARCH_API_TOKEN
        sync: false
      - key: STOCK_SEARCH_API_TOKEN
        sync: false
      - key: X_AUTH_TOKEN
        sync: false
      - key: ENABLE_BROWSER_COLLECTORS
        value: "false"
