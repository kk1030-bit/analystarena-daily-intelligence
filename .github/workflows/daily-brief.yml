name: Generate daily intelligence draft

on:
  schedule:
    # 07:00 Asia/Taipei (GitHub Actions cron uses UTC)
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: analystarena-daily-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Collect Reddit/X with Playwright and create draft
        run: npx tsx scripts/run-daily.ts
